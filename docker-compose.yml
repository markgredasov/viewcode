services:
  ranna:
    image: "ghcr.io/ranna-go/ranna:latest"
    environment:
      HOSTROOTDIR: "/var/opt/ranna"
      API.MAXOUTPUTLEN: "1M"
      SANDBOX.MEMORY: "1G"
      SANDBOX.TIMEOUTSECONDS: "60"
      SANDBOX.STREAMBUFFERCAP: "2M"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/opt/ranna:/var/opt/ranna"
    ports:
      - "8081:8080"
    restart: "on-failure"