services:
  ranna:
    image: "ghcr.io/ranna-go/ranna:latest"
    environment:
      HOSTROOTDIR: "/var/opt/ranna"
      API.MAXOUTPUTLEN: "1M"
      SANDBOX.MEMORY: "512M"
      SANDBOX.TIMEOUTSECONDS: "20"
      SANDBOX.STREAMBUFFERCAP: "1M"
      API_TLS_ENABLED: "false"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/opt/ranna:/var/opt/ranna"
    ports:
      - "8081:8080"
    restart: "on-failure"